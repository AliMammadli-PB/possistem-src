<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f74d6"/>
      <stop offset="1" stop-color="#082f63"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd27a"/>
      <stop offset="1" stop-color="#f0a531"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" rx="224" fill="url(#bg)"/>
  <rect x="28" y="28" width="968" height="968" rx="200" fill="none" stroke="#ffffff" stroke-opacity=".12" stroke-width="8"/>
  <!-- stacked cases: two below, one on top -->
  <g stroke="#fff" stroke-width="36" stroke-linejoin="round" fill="none">
    <rect x="196" y="468" width="300" height="252" rx="22"/>
    <rect x="528" y="468" width="300" height="252" rx="22"/>
    <rect x="362" y="196" width="300" height="252" rx="22" fill="url(#amber)" stroke="#fff"/>
  </g>
  <!-- tape lines on the cases -->
  <g stroke="#fff" stroke-width="30" stroke-linecap="round">
    <path d="M346 468v96M678 468v96"/>
  </g>
  <path d="M512 196v96" stroke="#082f63" stroke-width="30" stroke-linecap="round"/>
  <!-- pallet -->
  <g fill="#fff">
    <rect x="160" y="756" width="704" height="40" rx="14"/>
    <rect x="196" y="796" width="80" height="44" rx="8"/>
    <rect x="472" y="796" width="80" height="44" rx="8"/>
    <rect x="748" y="796" width="80" height="44" rx="8"/>
  </g>
</svg>
