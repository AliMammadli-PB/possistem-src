name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: types, lint, unit tests, audit
    runs-on: ubuntu-24.04
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            restoranpos/package-lock.json
            marketpos/package-lock.json
            geyimpos/package-lock.json
            aptekpos/package-lock.json
            topdanpos/package-lock.json
      - name: Install (restaurant + shared tooling)
        working-directory: restoranpos
        run: npm ci --no-audit --no-fund
      - name: Install (market UI)
        working-directory: marketpos
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install (Geyim UI)
        working-directory: geyimpos
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install (Aptek UI)
        working-directory: aptekpos
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install (Topdan UI)
        working-directory: topdanpos
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Versions agree (package, lock, CMake, Electron)
        working-directory: restoranpos
        run: npm run check:versions
      - name: Vendored C++ dependencies match SHA256SUMS
        working-directory: restoranpos
        run: node scripts/verify-third-party.mjs
      - name: Typecheck (restaurant, market, Geyim, Aptek, Topdan)
        working-directory: restoranpos
        run: npm run typecheck
      - name: Lint (Electron main, build and patch scripts)
        working-directory: restoranpos
        run: npm run lint
      - name: Unit tests
        working-directory: restoranpos
        run: npx vitest run
      - name: Restaurant assembly is reproducible (fail-closed patches)
        working-directory: restoranpos
        run: |
          npm run build:desktop
          git diff --exit-code -- . ':(exclude)out/main' ':(exclude)out/renderer'
      - name: Market renderer build
        working-directory: restoranpos
        run: npm run market:build
      - name: Geyim renderer build
        working-directory: restoranpos
        run: npm run geyim:build
      - name: Aptek renderer build
        working-directory: restoranpos
        run: npm run aptek:build
      - name: Topdan renderer build
        working-directory: restoranpos
        run: npm run topdan:build
      - name: npm audit (high and above)
        run: |
          (cd restoranpos && npm audit --audit-level=high)
          (cd marketpos && npm audit --audit-level=high)
          (cd geyimpos && npm audit --audit-level=high)
          (cd aptekpos && npm audit --audit-level=high)
          (cd topdanpos && npm audit --audit-level=high)
      - name: SBOM
        run: |
          (cd restoranpos && npm sbom --sbom-format cyclonedx > ../sbom-restoranpos.cdx.json)
          (cd marketpos && npm sbom --sbom-format cyclonedx > ../sbom-marketpos.cdx.json)
          (cd geyimpos && npm sbom --sbom-format cyclonedx > ../sbom-geyimpos.cdx.json)
          (cd aptekpos && npm sbom --sbom-format cyclonedx > ../sbom-aptekpos.cdx.json)
          (cd topdanpos && npm sbom --sbom-format cyclonedx > ../sbom-topdanpos.cdx.json)
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom-*.cdx.json

  native:
    name: C++ cores (MinGW cross-build, tests under Wine)
    runs-on: ubuntu-24.04
    env:
      # Receipt golden files are rendered at UTC+3. msvcrt under Wine only
      # understands the Windows TZ form, not an IANA name.
      TZ: TRT-3
      WINEDEBUG: -all
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Toolchain
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build g++-mingw-w64-x86-64 wine64 wine-binfmt
          # std::thread / std::mutex need the posix threading model.
          sudo update-alternatives --set x86_64-w64-mingw32-g++ /usr/bin/x86_64-w64-mingw32-g++-posix
          sudo update-alternatives --set x86_64-w64-mingw32-gcc /usr/bin/x86_64-w64-mingw32-gcc-posix
          sudo update-binfmts --import /usr/share/binfmts/wine || true
      - name: Restaurant core
        working-directory: restoranpos
        run: |
          node scripts/build-core.mjs --config Release
          # binfmt_misc is not available to the runner, so the .exe runs through wine explicitly.
          WINE=$(command -v wine || command -v wine64)
          cd native/build && "$WINE" ./core_tests.exe --reporter compact
      - name: Market core
        working-directory: restoranpos
        run: |
          node scripts/build-market-core.mjs
          WINE=$(command -v wine || command -v wine64)
          cd ../marketpos/native/build && "$WINE" ./market_core_tests.exe --reporter compact
      - name: Geyim core
        working-directory: restoranpos
        run: |
          POS_APP=geyimpos node scripts/build-market-core.mjs
          WINE=$(command -v wine || command -v wine64)
          cd ../geyimpos/native/build && "$WINE" ./market_core_tests.exe --reporter compact
      - name: Aptek core
        working-directory: restoranpos
        run: |
          POS_APP=aptekpos node scripts/build-market-core.mjs
          WINE=$(command -v wine || command -v wine64)
          cd ../aptekpos/native/build && "$WINE" ./market_core_tests.exe --reporter compact
      - name: Topdan core
        working-directory: restoranpos
        run: |
          POS_APP=topdanpos node scripts/build-market-core.mjs
          WINE=$(command -v wine || command -v wine64)
          cd ../topdanpos/native/build && "$WINE" ./market_core_tests.exe --reporter compact

  cpp-static:
    name: C++ static analysis (clang-tidy)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake ninja-build clang clang-tidy
      - run: bash restoranpos/scripts/static-analysis-cpp.sh

  demo-wasm:
    name: live demo (all five cores in WebAssembly)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake ninja-build
      - name: Emscripten
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          "$RUNNER_TEMP/emsdk/emsdk" install latest
          "$RUNNER_TEMP/emsdk/emsdk" activate latest
      - name: Build both cores to WebAssembly
        run: |
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          emcmake cmake -S restoranpos/native -B restoranpos/native/build-wasm -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build restoranpos/native/build-wasm --target pos_core_wasm
          emcmake cmake -S marketpos/native -B marketpos/native/build-wasm -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build marketpos/native/build-wasm --target market_core_wasm
          emcmake cmake -S geyimpos/native -B geyimpos/native/build-wasm -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build geyimpos/native/build-wasm --target market_core_wasm
          test -s geyimpos/native/build-wasm/geyim-pos-core.wasm
          emcmake cmake -S aptekpos/native -B aptekpos/native/build-wasm -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build aptekpos/native/build-wasm --target market_core_wasm
          test -s aptekpos/native/build-wasm/aptek-pos-core.wasm
          emcmake cmake -S topdanpos/native -B topdanpos/native/build-wasm -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build topdanpos/native/build-wasm --target market_core_wasm
          test -s topdanpos/native/build-wasm/topdan-pos-core.wasm
      - run: node restoranpos/demo-web/smoke.mjs restoranpos/native/build-wasm marketpos/native/build-wasm

  secrets:
    name: secret scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
