appId: com.cyberplus.maisonaurelia.pos
productName: possistem
executableName: possistem
copyright: Copyright © 2026 Ali Mammadli / possistem
electronVersion: 43.7.5
directories:
  # Versioned dir avoids EBUSY when release/win-unpacked is locked by a running app.
  output: release-${version}
  buildResources: build
files:
  - out/**/*
  - package.json
  # Explicit updater dependency closure: node_modules may be a worktree symlink.
  - { from: node_modules/electron-updater, to: node_modules/electron-updater }
  # A nested node_modules is skipped by the copy above; electron-updater pins its own semver.
  - { from: node_modules/electron-updater/node_modules/semver, to: node_modules/electron-updater/node_modules/semver }
  - { from: node_modules/builder-util-runtime, to: node_modules/builder-util-runtime }
  - { from: node_modules/fs-extra, to: node_modules/fs-extra }
  - { from: node_modules/graceful-fs, to: node_modules/graceful-fs }
  - { from: node_modules/jsonfile, to: node_modules/jsonfile }
  - { from: node_modules/universalify, to: node_modules/universalify }
  - { from: node_modules/js-yaml, to: node_modules/js-yaml }
  - { from: node_modules/argparse, to: node_modules/argparse }
  - { from: node_modules/lazy-val, to: node_modules/lazy-val }
  - { from: node_modules/lodash.escaperegexp, to: node_modules/lodash.escaperegexp }
  - { from: node_modules/lodash.isequal, to: node_modules/lodash.isequal }
  - { from: node_modules/tiny-typed-emitter, to: node_modules/tiny-typed-emitter }
  - { from: node_modules/debug, to: node_modules/debug }
  - { from: node_modules/ms, to: node_modules/ms }
  - { from: node_modules/sax, to: node_modules/sax }
extraResources:
  - from: native/build/restaurant-pos-core.exe
    to: native/win32-x64/restaurant-pos-core.exe
  - from: database/migrations
    to: native/migrations
  - from: database/seed
    to: native/seed
win:
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
  artifactName: Possistem-Setup-${version}.${ext}
  icon: build/icon.ico
  # Production packaging is fail-closed in scripts/package-win.mjs when CSC_LINK is absent.
nsis:
  artifactName: Possistem-Setup-${version}.${ext}
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: true
  allowElevation: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: possistem
  uninstallDisplayName: possistem
  deleteAppDataOnUninstall: false
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
portable:
  artifactName: Possistem-Portable-${version}.${ext}
  requestExecutionLevel: user
asar: true
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  grantFileProtocolExtraPrivileges: false
compression: maximum
publish:
  provider: generic
  url: https://possistem.az/pos-updates/

