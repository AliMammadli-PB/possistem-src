# Geyim POS installer and electron-updater feed (same shape as marketpos.conf).
location ^~ /geyimpos/downloads/ {
  alias /var/www/geyimpos/downloads/;
  default_type application/octet-stream;
  add_header X-Content-Type-Options nosniff always;
}
location = /geyimpos/updates/latest.yml {
  alias /var/www/geyimpos/updates/latest.yml;
  default_type application/yaml;
  add_header Cache-Control 'no-store, no-cache, must-revalidate' always;
}
location ^~ /geyimpos/updates/ {
  alias /var/www/geyimpos/updates/;
  default_type application/octet-stream;
  add_header X-Content-Type-Options nosniff always;
}
