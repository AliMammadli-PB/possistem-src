# Aptek POS installer and electron-updater feed (same shape as marketpos.conf).
location ^~ /aptekpos/downloads/ {
  alias /var/www/aptekpos/downloads/;
  default_type application/octet-stream;
  add_header X-Content-Type-Options nosniff always;
}
location = /aptekpos/updates/latest.yml {
  alias /var/www/aptekpos/updates/latest.yml;
  default_type application/yaml;
  add_header Cache-Control 'no-store, no-cache, must-revalidate' always;
}
location ^~ /aptekpos/updates/ {
  alias /var/www/aptekpos/updates/;
  default_type application/octet-stream;
  add_header X-Content-Type-Options nosniff always;
}
