# Topdan POS installer and electron-updater feed (same shape as marketpos.conf).
location ^~ /topdanpos/downloads/ {
  alias /var/www/topdanpos/downloads/;
  default_type application/octet-stream;
  add_header X-Content-Type-Options nosniff always;
}
location = /topdanpos/updates/latest.yml {
  alias /var/www/topdanpos/updates/latest.yml;
  default_type application/yaml;
  add_header Cache-Control 'no-store, no-cache, must-revalidate' always;
}
location ^~ /topdanpos/updates/ {
  alias /var/www/topdanpos/updates/;
  default_type application/octet-stream;
  add_header X-Content-Type-Options nosniff always;
}
