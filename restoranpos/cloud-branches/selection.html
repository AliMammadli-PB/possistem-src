<!doctype html><html lang="az"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Filial seçimi</title><style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,sans-serif;background:#f1f5fb;color:#152d4c}body{display:grid;place-items:center;padding:24px}main{width:min(680px,100%);background:#fff;border:1px solid #d4e0ef;border-radius:24px;padding:32px;box-shadow:0 18px 70px #183b6610}h1{margin:0 0 12px;font-size:28px}p{color:#526985;line-height:1.6;margin:10px 0}#options{display:grid;gap:12px;margin:24px 0}button,select{font:inherit;min-height:56px;touch-action:manipulation;border:1px solid #c3d5ec;border-radius:14px;padding:14px 18px;background:#fff;color:#174c8e;cursor:pointer;font-weight:700}button:focus-visible{outline:3px solid #4487e0;outline-offset:2px}button:disabled{cursor:default;opacity:.55}.choice{text-align:left;font-size:20px;overflow-wrap:anywhere}.choice[aria-pressed=true]{border:2px solid #2467c2;background:#edf5ff}.primary{background:#1559b7;color:#fff;border-color:#1559b7}footer{display:flex;flex-wrap:wrap;gap:12px}footer button{flex:1;min-width:130px}#error{color:#ae293a}#status{font-size:14px}#offline{padding:14px;border-radius:12px;background:#fff8e7;color:#7c5b18}#offline:empty{display:none}[hidden]{display:none!important}@media(max-width:500px){body{padding:14px}main{padding:22px}h1{font-size:24px}}
</style></head><body><main><h1 id="title">Filial seçin</h1><p id="lead"></p><p id="status" role="status"></p><div id="offline"></div><div id="options"></div><p id="error" role="alert"></p><footer><button id="continue" class="primary" disabled></button><button id="objects" hidden></button><button id="refresh"></button><button id="logout"></button></footer></main><script src="selection.js"></script></body></html>
