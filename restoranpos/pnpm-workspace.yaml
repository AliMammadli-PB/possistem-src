# The Windows installer is packaged on Linux, so the win32-x64 halves of the
# prebuilt binaries (sharp above all) have to be fetched here too - otherwise
# app.asar ships a runtime the target platform cannot load.
supportedArchitectures:
  os:
    - current
    - win32
  cpu:
    - current
    - x64

allowBuilds:
  cpu-features: set this to true or false
  electron-winstaller: set this to true or false
  esbuild: set this to true or false
  sharp: set this to true or false
  ssh2: set this to true or false
