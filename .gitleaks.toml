# Default gitleaks rules plus an allowlist for values that are public by design.
[extend]
useDefault = true

[allowlist]
description = "public keys and lockfile integrity hashes"
paths = [
  '''(^|/)package-lock\.json$''',
  '''(^|/)SHA256SUMS$''',
  '''(^|/)native/third_party/''',
  '''(^|/)packaged-renderer/assets/index-[A-Za-z0-9_-]+\.js$''',
]
regexes = [
  # RustDesk relay server public key (clients are configured with it)
  '''dw8ACToVyLG5UPrDwi9CON50CluDQ0nBRhpYjVhCyrI=''',
  # production licence verification public key and key id
  '''1338db4cbec4934a387a1cc73c3589f3b0f58dac63be7fed0bf2a7e455e336c3''',
  '''ed25519-42cd45bfa4ca3125''',
  # localStorage key names of the retail tills (possistem.geyim.pos.v2), not credentials
  '''(possistem|cyberplus)\.(market|geyim)\.pos\.[a-z0-9.${}-]+''',
]
