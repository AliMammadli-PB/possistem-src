<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <defs>
    <radialGradient id="room" cx=".55" cy=".35" r=".9">
      <stop offset="0" stop-color="#1c3558"/>
      <stop offset=".55" stop-color="#0d1a2e"/>
      <stop offset="1" stop-color="#050b16"/>
    </radialGradient>
    <linearGradient id="rail" x1="0" x2="1"><stop offset="0" stop-color="#8a6a3a"/><stop offset=".5" stop-color="#e9cf8c"/><stop offset="1" stop-color="#8a6a3a"/></linearGradient>
    <radialGradient id="lamp" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#ffd9a0" stop-opacity=".55"/><stop offset="1" stop-color="#ffd9a0" stop-opacity="0"/></radialGradient>
    <g id="g" fill="none" stroke="#d9c08a" stroke-width="5" stroke-linecap="round"><path d="M0 0v18"/><path d="M0 18l-70 40h140z"/></g>
    <filter id="soft"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="blur"><feGaussianBlur stdDeviation="18"/></filter>
  </defs>
  <rect width="1920" height="1080" fill="url(#room)"/>
  <!-- warm spot lights -->
  <circle cx="520" cy="120" r="260" fill="url(#lamp)"/>
  <circle cx="1180" cy="100" r="300" fill="url(#lamp)"/>
  <circle cx="1720" cy="140" r="220" fill="url(#lamp)"/>
  <!-- wall panels -->
  <g stroke="#35557f" stroke-opacity=".35" stroke-width="3" fill="none">
    <rect x="80" y="120" width="360" height="760" rx="8"/>
    <rect x="1500" y="120" width="360" height="760" rx="8"/>
  </g>
  <!-- rail -->
  <rect x="300" y="300" width="1320" height="14" rx="7" fill="url(#rail)"/>
  <rect x="330" y="300" width="10" height="620" fill="#6f5530"/>
  <rect x="1580" y="300" width="10" height="620" fill="#6f5530"/>
  <!-- garments on hangers -->
  <g filter="url(#soft)">
    <use href="#g" x="430" y="306"/><path d="M362 350h136l18 360H344z" fill="#7a2952"/>
    <use href="#g" x="590" y="306"/><path d="M520 350h140l-8 90 40 290H488l40-290z" fill="#d8c3a5"/>
    <use href="#g" x="750" y="306"/><path d="M682 350h136l10 330H672z" fill="#2c2c34"/>
    <use href="#g" x="905" y="306"/><path d="M836 350h138l60 420H776z" fill="#b25a7c"/>
    <use href="#g" x="1060" y="306"/><path d="M992 350h136l6 300H986z" fill="#e9e1d6"/>
    <use href="#g" x="1210" y="306"/><path d="M1142 350h136l14 380H1128z" fill="#6b4429"/>
    <use href="#g" x="1360" y="306"/><path d="M1294 350h132l40 400H1254z" fill="#1f2f56"/>
    <use href="#g" x="1500" y="306"/><path d="M1436 350h128l6 320H1430z" fill="#c9a24a"/>
  </g>
  <!-- floor and reflection -->
  <rect y="930" width="1920" height="150" fill="#040913"/>
  <ellipse cx="960" cy="940" rx="760" ry="26" fill="#000" opacity=".5" filter="url(#blur)"/>
  <rect width="1920" height="1080" fill="#000" opacity=".22"/>
</svg>
